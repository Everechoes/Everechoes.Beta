<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600;1,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;display=swap');

      /* Animations */
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseTri {
        0%, 100% { opacity: 0.92; transform: translateY(0px) scale(1); }
        50% { opacity: 1; transform: translateY(-3px) scale(1.02); }
      }
      @keyframes runeGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.85; }
      }

      .bg { fill: #F5F2EC; }
      .bg-inner { fill: #FAF8F5; }
      
      .spin-ring {
        transform-origin: 780px 100px;
        animation: spinSlow 45s linear infinite;
      }
      .spin-ring-rev {
        transform-origin: 780px 100px;
        animation: spinReverse 30s linear infinite;
      }
      
      .geo-tri {
        animation: pulseTri 6s ease-in-out infinite alternate;
      }
      .rune-circ {
        animation: runeGlow 4s ease-in-out infinite alternate;
      }

      /* Typography */
      .font-cinzel { font-family: 'Cinzel', Georgia, serif; }
      .font-playfair { font-family: 'Playfair Display', Georgia, serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

      .dossier-tag {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #C4A265;
        text-transform: uppercase;
      }
      .title-intro {
        font-size: 58px;
        font-weight: 700;
        fill: #1C1917;
        letter-spacing: -0.5px;
      }
      .title-accent {
        font-size: 64px;
        font-weight: 700;
        font-style: italic;
        fill: #C4A265;
      }
      .dossier-sub {
        font-size: 15px;
        font-weight: 600;
        fill: #5C554F;
        letter-spacing: 1.5px;
      }
      .dossier-body {
        font-size: 14.5px;
        line-height: 24px;
        fill: #3E3834;
      }
      .afflatus-pill {
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 700;
        fill: #FAF8F5;
      }
      .stamp-txt {
        font-size: 10px;
        letter-spacing: 2px;
        fill: #C4A265;
        font-weight: 700;
      }
    </style>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4A265"/>
      <stop offset="50%" stop-color="#E8CE96"/>
      <stop offset="100%" stop-color="#C4A265"/>
    </linearGradient>

    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DDD7CE" opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="440" rx="16" class="bg" />
  <rect x="12" y="12" width="896" height="416" rx="12" class="bg-inner" stroke="#E2DDD5" stroke-width="1.5" />
  <rect x="12" y="12" width="896" height="416" rx="12" fill="url(#dotPattern)" />

  <!-- Outer Editorial Borders & Corner Marks -->
  <g stroke="#C4A265" stroke-width="1" opacity="0.6">
    <line x1="28" y1="28" x2="60" y2="28" />
    <line x1="28" y1="28" x2="28" y2="60" />
    <line x1="892" y1="28" x2="860" y2="28" />
    <line x1="892" y1="28" x2="892" y2="60" />
    <line x1="28" y1="412" x2="60" y2="412" />
    <line x1="28" y1="412" x2="28" y2="380" />
    <line x1="892" y1="412" x2="860" y2="412" />
    <line x1="892" y1="412" x2="892" y2="380" />
  </g>

  <!-- Top-Right Checkerboard Pattern (St. Pavlov Motif) -->
  <g transform="translate(620, 24)" opacity="0.35">
    <g fill="#7D7671">
      <rect x="0" y="0" width="16" height="8" />
      <rect x="32" y="0" width="16" height="8" />
      <rect x="64" y="0" width="16" height="8" />
      <rect x="96" y="0" width="16" height="8" />
      <rect x="128" y="0" width="16" height="8" />
      <rect x="160" y="0" width="16" height="8" />
      <rect x="192" y="0" width="16" height="8" />
      <rect x="224" y="0" width="16" height="8" />

      <rect x="16" y="8" width="16" height="8" />
      <rect x="48" y="8" width="16" height="8" />
      <rect x="80" y="8" width="16" height="8" />
      <rect x="112" y="8" width="16" height="8" />
      <rect x="144" y="8" width="16" height="8" />
      <rect x="176" y="8" width="16" height="8" />
      <rect x="208" y="8" width="16" height="8" />
      <rect x="240" y="8" width="16" height="8" />

      <rect x="0" y="16" width="16" height="8" />
      <rect x="32" y="16" width="16" height="8" />
      <rect x="64" y="16" width="16" height="8" />
      <rect x="96" y="16" width="16" height="8" />
      <rect x="128" y="16" width="16" height="8" />
      <rect x="160" y="16" width="16" height="8" />
      <rect x="192" y="16" width="16" height="8" />
      <rect x="224" y="16" width="16" height="8" />
    </g>
  </g>

  <!-- Astrolabe Ring in Background -->
  <g opacity="0.30">
    <circle cx="780" cy="110" r="140" fill="none" stroke="#D1C8BC" stroke-width="1" stroke-dasharray="4,6" class="spin-ring" />
    <circle cx="780" cy="110" r="115" fill="none" stroke="#C4A265" stroke-width="1.2" class="spin-ring-rev" />
    <circle cx="780" cy="110" r="85" fill="none" stroke="#B8B0A4" stroke-width="0.8" stroke-dasharray="2,4" class="spin-ring" />
    <line x1="640" y1="110" x2="920" y2="110" stroke="#DDD7CE" stroke-width="0.8" stroke-dasharray="3,3" />
    <line x1="780" y1="-30" x2="780" y2="250" stroke="#DDD7CE" stroke-width="0.8" stroke-dasharray="3,3" />
  </g>

  <!-- Top-Right Geometric Triangles (St. Pavlov Monochrome & Antique Gold) -->
  <g id="top-triangles">
    <polygon points="730,40 778,40 754,81" fill="#C4A265" class="geo-tri" style="animation-delay: 0.2s;" />
    <polygon points="778,40 754,81 802,81" fill="#7D7671" class="geo-tri" style="animation-delay: 0.5s;" />
    <polygon points="778,40 826,40 802,81" fill="#231F1D" class="geo-tri" style="animation-delay: 0.1s;" />
    <polygon points="826,40 802,81 850,81" fill="#DDD7CE" class="geo-tri" style="animation-delay: 0.4s;" />
    <polygon points="826,40 874,40 850,81" fill="#C4A265" class="geo-tri" style="animation-delay: 0.7s;" />
    <polygon points="874,40 850,81 898,81" fill="#7D7671" class="geo-tri" style="animation-delay: 0.3s;" />

    <polygon points="730,81 706,122 754,122" fill="#7D7671" class="geo-tri" style="animation-delay: 0.3s;" />
    <polygon points="730,81 778,81 754,122" fill="#E8E2D8" class="geo-tri" style="animation-delay: 0.6s;" />
    <polygon points="778,81 754,122 802,122" fill="#C4A265" class="geo-tri" style="animation-delay: 0.1s;" />
    <polygon points="778,81 826,81 802,122" fill="#231F1D" class="geo-tri" style="animation-delay: 0.8s;" />
    <polygon points="826,81 802,122 850,122" fill="#7D7671" class="geo-tri" style="animation-delay: 0.4s;" />
    <polygon points="826,81 874,81 850,122" fill="#C4A265" class="geo-tri" style="animation-delay: 0.2s;" />

    <polygon points="682,122 658,163 706,163" fill="#C4A265" class="geo-tri" style="animation-delay: 0.5s;" />
    <polygon points="682,122 730,122 706,163" fill="#231F1D" class="geo-tri" style="animation-delay: 0.2s;" />
    <polygon points="730,122 706,163 754,163" fill="#7D7671" class="geo-tri" style="animation-delay: 0.9s;" />
    <polygon points="730,122 778,122 754,163" fill="#C4A265" class="geo-tri" style="animation-delay: 0.4s;" />
    <polygon points="778,122 754,163 802,163" fill="#DDD7CE" class="geo-tri" style="animation-delay: 0.7s;" />
  </g>

  <!-- Bottom-Left Geometric Triangles -->
  <g id="bottom-triangles">
    <polygon points="168,260 144,301 192,301" fill="#C4A265" class="geo-tri" style="animation-delay: 0.4s;" />
    <polygon points="120,301 168,301 144,342" fill="#DDD7CE" class="geo-tri" style="animation-delay: 0.2s;" />
    <polygon points="168,301 144,342 192,342" fill="#7D7671" class="geo-tri" style="animation-delay: 0.6s;" />
    <polygon points="168,301 216,301 192,342" fill="#231F1D" class="geo-tri" style="animation-delay: 0.1s;" />
    <polygon points="72,342 48,383 96,383" fill="#231F1D" class="geo-tri" style="animation-delay: 0.5s;" />
    <polygon points="72,342 120,342 96,383" fill="#C4A265" class="geo-tri" style="animation-delay: 0.3s;" />
    <polygon points="120,342 96,383 144,383" fill="#7D7671" class="geo-tri" style="animation-delay: 0.7s;" />
    <polygon points="120,342 168,342 144,383" fill="#DDD7CE" class="geo-tri" style="animation-delay: 0.4s;" />
    <polygon points="168,342 144,383 192,383" fill="#231F1D" class="geo-tri" style="animation-delay: 0.8s;" />
    <polygon points="168,342 216,342 192,383" fill="#C4A265" class="geo-tri" style="animation-delay: 0.2s;" />

    <polygon points="24,383 0,424 48,424" fill="#C4A265" class="geo-tri" style="animation-delay: 0.1s;" />
    <polygon points="24,383 72,383 48,424" fill="#DDD7CE" class="geo-tri" style="animation-delay: 0.5s;" />
    <polygon points="72,383 48,424 96,424" fill="#7D7671" class="geo-tri" style="animation-delay: 0.7s;" />
    <polygon points="72,383 120,383 96,424" fill="#231F1D" class="geo-tri" style="animation-delay: 0.2s;" />
    <polygon points="120,383 96,424 144,424" fill="#C4A265" class="geo-tri" style="animation-delay: 0.9s;" />
    <polygon points="120,383 168,383 144,424" fill="#DDD7CE" class="geo-tri" style="animation-delay: 0.3s;" />
    <polygon points="168,383 144,424 192,424" fill="#7D7671" class="geo-tri" style="animation-delay: 0.6s;" />
    <polygon points="168,383 216,383 192,424" fill="#C4A265" class="geo-tri" style="animation-delay: 0.4s;" />
  </g>

  <!-- Dossier Header Badges & Stamps -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="220" height="22" rx="3" fill="#231F1D" />
    <text x="12" y="15" class="font-mono dossier-tag">ST. PAVLOV FOUNDATION</text>

    <!-- Subtext directly inspired by the card -->
    <text x="235" y="15" class="font-mono" font-size="9" font-weight="700" fill="#7D7671" letter-spacing="1.5px">FOR PASSING AND ISSUING ORDERS ONLY</text>

    <!-- Star Rating -->
    <text x="545" y="16" font-size="14" fill="#C4A265">✦ ✦ ✦ ✦ ✦ ✦</text>
  </g>

  <!-- Main Editorial Title & Narrative -->
  <g transform="translate(60, 110)">
    <!-- Sub-heading -->
    <text x="0" y="24" class="font-cinzel dossier-sub">Software Engineering Student · Web Developer</text>

    <!-- Big Headline: Intro to Everechoes -->
    <text x="0" y="82">
      <tspan class="font-playfair title-intro">Intro to </tspan>
      <tspan class="font-playfair title-accent">Everechoes</tspan>
    </text>

    <!-- Divider ornament -->
    <path d="M 0 102 L 320 102" stroke="url(#goldAccent)" stroke-width="2" />
    <polygon points="325,102 331,98 337,102 331,106" fill="#C4A265" />

    <!-- Editorial Description Paragraph -->
    <text x="0" y="132" class="font-playfair dossier-body">
      <tspan x="0" dy="0">A verified personnel record of a Software Engineering student at SMK Telkom</tspan>
      <tspan x="0" dy="25">Banjarbaru, dedicated to weaving interactive digital platforms into visual existence.</tspan>
      <tspan x="0" dy="25">Specializing in Web Development, UI/UX Craftsmanship, and Full-Stack Architecture.</tspan>
    </text>

    <!-- Signature Mark -->
    <text x="0" y="224" class="font-playfair" font-size="16" font-style="italic" fill="#C4A265" font-weight="700">
      — E.E. · Timekeeper of Digital Echoes
    </text>
  </g>

  <!-- Right-side Seal & Stamp (St. Pavlov Foundation Approved Style) -->
  <g transform="translate(730, 310)">
    <!-- Outer dashed circle stamp -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="#C4A265" stroke-width="1.5" stroke-dasharray="4,3" class="rune-circ" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="#D1C8BC" stroke-width="0.8" />
    <!-- Center text stamp -->
    <text x="50" y="44" text-anchor="middle" class="font-cinzel stamp-txt">ST. PAVLOV</text>
    <text x="50" y="58" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#1C1917">APPROVED</text>
    <text x="50" y="70" text-anchor="middle" class="font-cinzel" font-size="8" fill="#C4A265">OFFICIAL SEAL</text>
  </g>
</svg>
