<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Space+Mono:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');

      .bg { fill: #F5F2EC; }
      .bg-inner { fill: #FAF8F5; }
      
      .font-cinzel { font-family: 'Cinzel', Georgia, serif; }
      .font-playfair { font-family: 'Playfair Display', Georgia, serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-sans { font-family: 'Plus Jakarta Sans', sans-serif; }

      @keyframes barLoad {
        from { width: 0; }
      }

      .bar-fill {
        animation: barLoad 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transition: filter 0.25s ease, opacity 0.25s ease;
      }

      .metric-row {
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .metric-row:hover {
        transform: translateX(4px);
      }
      .metric-row:hover .bar-fill {
        filter: drop-shadow(0 0 6px #C4A265);
      }
      .metric-row:hover .metric-label {
        fill: #C4A265;
      }

      .metric-label {
        transition: fill 0.2s ease;
      }

      .info-row {
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .info-row:hover {
        transform: translateX(4px);
      }
      .info-row:hover .info-title {
        fill: #C4A265;
      }
      .info-title {
        transition: fill 0.2s ease;
      }
    </style>
    
    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4A265" />
      <stop offset="100%" stop-color="#8A6F3E" />
    </linearGradient>

    <pattern id="cardDots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DDD7CE" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Container -->
  <rect width="920" height="320" rx="14" class="bg" />
  <rect x="10" y="10" width="900" height="300" rx="10" class="bg-inner" stroke="#E2DDD5" stroke-width="1.2" />
  <rect x="10" y="10" width="900" height="300" rx="10" fill="url(#cardDots)" />

  <!-- Corner Ornamental Marks -->
  <g stroke="#C4A265" stroke-width="1.2" opacity="0.85">
    <path d="M 24 36 L 24 24 L 36 24" fill="none" />
    <path d="M 896 36 L 896 24 L 884 24" fill="none" />
    <path d="M 24 284 L 24 296 L 36 296" fill="none" />
    <path d="M 896 284 L 896 296 L 884 296" fill="none" />
  </g>

  <!-- Card Top Banner Label (St. Pavlov Foundation Motif) -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="220" height="24" rx="3" fill="#231F1D" />
    <text x="14" y="16" class="font-mono" font-size="11" font-weight="700" fill="#FAF8F5" letter-spacing="2px">
      ST. PAVLOV DOSSIER
    </text>
    <text x="240" y="17" class="font-cinzel" font-size="13" font-weight="700" fill="#1C1917" letter-spacing="1.5px">
      PERSONNEL RECORD · SPECIMEN NO. 1999-EE
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="68" x2="884" y2="68" stroke="#E2DDD5" stroke-width="1" />

  <!-- LEFT COLUMN: Identity & Lore Attributes -->
  <g transform="translate(42, 92)">
    <!-- Row 1: POSITION TITLE -->
    <g class="info-row">
      <text x="0" y="20" class="font-cinzel info-title" font-size="12" font-weight="700" fill="#7D7671" letter-spacing="1.5px">POSITION TITLE</text>
      <text x="145" y="20" class="font-sans" font-size="14" font-weight="700" fill="#1C1917" letter-spacing="0.5px">
        TIMEKEEPER <tspan font-family="'Playfair Display', serif" font-style="italic" fill="#C4A265">/ Web Developer</tspan>
      </text>
    </g>

    <!-- Row 2: AFFLATUS / DISCIPLINE -->
    <g class="info-row">
      <text x="0" y="55" class="font-cinzel info-title" font-size="12" font-weight="700" fill="#7D7671" letter-spacing="1.5px">AFFLATUS</text>
      <text x="145" y="55" class="font-sans" font-size="13.5" font-weight="600" fill="#231F1D">
        Intellect <tspan fill="#7D7671">·</tspan> Code &amp; Visual Synthesis
      </text>
    </g>

    <!-- Row 3: ACADEMY -->
    <g class="info-row">
      <text x="0" y="90" class="font-cinzel info-title" font-size="12" font-weight="700" fill="#7D7671" letter-spacing="1.5px">ACADEMY</text>
      <text x="145" y="90" class="font-sans" font-size="13.5" font-weight="600" fill="#231F1D">
        SMK Telkom Banjarbaru (RPL)
      </text>
    </g>

    <!-- Row 4: SPECIALTY -->
    <g class="info-row">
      <text x="0" y="125" class="font-cinzel info-title" font-size="12" font-weight="700" fill="#7D7671" letter-spacing="1.5px">SPECIALTY</text>
      <text x="145" y="125" class="font-sans" font-size="13.5" font-weight="600" fill="#231F1D">
        Full-Stack Engineering &amp; UI/UX Craft
      </text>
    </g>

    <!-- Row 5: PASSIVE -->
    <g class="info-row">
      <text x="0" y="160" class="font-cinzel info-title" font-size="12" font-weight="700" fill="#7D7671" letter-spacing="1.5px">PASSIVE</text>
      <text x="145" y="160" class="font-playfair" font-size="14" font-style="italic" fill="#8A6F3E">
        "Perpetual Curiosity"
      </text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="490" y1="82" x2="490" y2="280" stroke="#E2DDD5" stroke-width="1" stroke-dasharray="3,3" />

  <!-- RIGHT COLUMN: Aptitude & Mastery Meters (Interactive Hover) -->
  <g transform="translate(520, 92)">
    <text x="0" y="10" class="font-cinzel" font-size="12" font-weight="700" fill="#C4A265" letter-spacing="2px">
      ARCANUM APTITUDE METRICS
    </text>

    <!-- Stat 1: UI/UX Craftsmanship -->
    <g transform="translate(0, 32)" class="metric-row">
      <text x="0" y="12" class="font-sans metric-label" font-size="13" font-weight="600" fill="#1C1917">UI/UX Design &amp; Aesthetics</text>
      <text x="350" y="12" text-anchor="end" class="font-mono" font-size="12" font-weight="700" fill="#C4A265">92%</text>
      <rect x="0" y="20" width="350" height="8" rx="4" fill="#E8E2D8" />
      <rect x="0" y="20" width="322" height="8" rx="4" fill="url(#goldBarGrad)" class="bar-fill" />
    </g>

    <!-- Stat 2: Frontend Engineering -->
    <g transform="translate(0, 72)" class="metric-row">
      <text x="0" y="12" class="font-sans metric-label" font-size="13" font-weight="600" fill="#1C1917">Frontend Interactive Dev</text>
      <text x="350" y="12" text-anchor="end" class="font-mono" font-size="12" font-weight="700" fill="#C4A265">90%</text>
      <rect x="0" y="20" width="350" height="8" rx="4" fill="#E8E2D8" />
      <rect x="0" y="20" width="315" height="8" rx="4" fill="url(#goldBarGrad)" class="bar-fill" />
    </g>

    <!-- Stat 3: Backend & Logic -->
    <g transform="translate(0, 112)" class="metric-row">
      <text x="0" y="12" class="font-sans metric-label" font-size="13" font-weight="600" fill="#1C1917">Backend Logic Architecture</text>
      <text x="350" y="12" text-anchor="end" class="font-mono" font-size="12" font-weight="700" fill="#C4A265">84%</text>
      <rect x="0" y="20" width="350" height="8" rx="4" fill="#E8E2D8" />
      <rect x="0" y="20" width="294" height="8" rx="4" fill="url(#goldBarGrad)" class="bar-fill" />
    </g>

    <!-- Stat 4: Database & Schema -->
    <g transform="translate(0, 152)" class="metric-row">
      <text x="0" y="12" class="font-sans metric-label" font-size="13" font-weight="600" fill="#1C1917">Database &amp; Data Alchemy</text>
      <text x="350" y="12" text-anchor="end" class="font-mono" font-size="12" font-weight="700" fill="#C4A265">80%</text>
      <rect x="0" y="20" width="350" height="8" rx="4" fill="#E8E2D8" />
      <rect x="0" y="20" width="280" height="8" rx="4" fill="url(#goldBarGrad)" class="bar-fill" />
    </g>
  </g>
</svg>
