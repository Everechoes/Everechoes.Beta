<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Playfair+Display:ital,wght@0,600;1,600&amp;family=Space+Mono:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');

      .bg { fill: #F5F2EC; }
      .bg-inner { fill: #FAF8F5; }
      
      .font-cinzel { font-family: 'Cinzel', Georgia, serif; }
      .font-playfair { font-family: 'Playfair Display', Georgia, serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-sans { font-family: 'Plus Jakarta Sans', sans-serif; }

      .col-group {
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .col-group:hover {
        transform: translateY(-5px);
      }
      .col-group:hover .card-box {
        stroke: #C4A265;
        stroke-width: 1.8;
        filter: drop-shadow(0 6px 12px rgba(196, 162, 101, 0.22));
      }
      .col-group:hover .pill-badge {
        fill: #FFFDF9;
        stroke: #C4A265;
      }
      .col-group:hover .col-title {
        fill: #C4A265;
      }

      .card-box {
        fill: #FFFFFF;
        stroke: #E2DDD5;
        stroke-width: 1.2;
        rx: 10px;
        transition: all 0.3s ease;
      }
      
      .pill-badge {
        fill: #F6F3ED;
        stroke: #DCD6CC;
        stroke-width: 0.8;
        rx: 6px;
        transition: all 0.25s ease;
      }

      .col-title {
        transition: fill 0.25s ease;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="920" height="250" rx="14" class="bg" />
  <rect x="10" y="10" width="900" height="230" rx="10" class="bg-inner" stroke="#E2DDD5" stroke-width="1.2" />

  <!-- Section Header (St. Pavlov Foundation Style) -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="180" height="22" rx="3" fill="#231F1D" />
    <text x="12" y="15" class="font-mono" font-size="11" font-weight="700" fill="#FAF8F5" letter-spacing="2px">
      SPELLCRAFT &amp; TOOLS
    </text>
    <text x="195" y="16" class="font-cinzel" font-size="12" font-weight="700" fill="#C4A265" letter-spacing="1.5px">
      INCANTATION INVENTORY · [INTERACTIVE]
    </text>
  </g>

  <!-- 4 Interactive Columns -->
  <g transform="translate(36, 70)">
    <!-- Column 1: FRONTEND -->
    <g transform="translate(0, 0)" class="col-group">
      <rect width="200" height="150" class="card-box" />
      <rect x="12" y="14" width="6" height="14" fill="#C4A265" rx="2" />
      <text x="26" y="26" class="font-cinzel col-title" font-size="12" font-weight="700" fill="#1C1917">FRONTEND</text>
      
      <!-- Badges -->
      <g transform="translate(14, 44)">
        <rect width="172" height="26" class="pill-badge" />
        <text x="12" y="17" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> HTML</text>
      </g>
      <g transform="translate(14, 76)">
        <rect width="172" height="26" class="pill-badge" />
        <text x="12" y="17" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> CSS</text>
      </g>
      <g transform="translate(14, 108)">
        <rect width="172" height="26" class="pill-badge" />
        <text x="12" y="17" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> JAVASCRIPT</text>
      </g>
    </g>

    <!-- Column 2: BACKEND -->
    <g transform="translate(216, 0)" class="col-group">
      <rect width="200" height="150" class="card-box" />
      <rect x="12" y="14" width="6" height="14" fill="#C4A265" rx="2" />
      <text x="26" y="26" class="font-cinzel col-title" font-size="12" font-weight="700" fill="#1C1917">BACKEND</text>
      
      <g transform="translate(14, 52)">
        <rect width="172" height="30" class="pill-badge" />
        <text x="12" y="19" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> PHP</text>
      </g>
      <g transform="translate(14, 94)">
        <rect width="172" height="30" class="pill-badge" />
        <text x="12" y="19" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> LARAGON</text>
      </g>
    </g>

    <!-- Column 3: DATABASE -->
    <g transform="translate(432, 0)" class="col-group">
      <rect width="200" height="150" class="card-box" />
      <rect x="12" y="14" width="6" height="14" fill="#C4A265" rx="2" />
      <text x="26" y="26" class="font-cinzel col-title" font-size="12" font-weight="700" fill="#1C1917">DATABASE</text>
      
      <g transform="translate(14, 72)">
        <rect width="172" height="34" class="pill-badge" />
        <text x="12" y="22" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> MYSQL</text>
      </g>
    </g>

    <!-- Column 4: TOOLS & DESIGN -->
    <g transform="translate(648, 0)" class="col-group">
      <rect width="200" height="150" class="card-box" />
      <rect x="12" y="14" width="6" height="14" fill="#C4A265" rx="2" />
      <text x="26" y="26" class="font-cinzel col-title" font-size="12" font-weight="700" fill="#1C1917">TOOLS &amp; DESIGN</text>
      
      <g transform="translate(14, 44)">
        <rect width="172" height="26" class="pill-badge" />
        <text x="12" y="17" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> FIGMA</text>
      </g>
      <g transform="translate(14, 76)">
        <rect width="172" height="26" class="pill-badge" />
        <text x="12" y="17" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> GIT</text>
      </g>
      <g transform="translate(14, 108)">
        <rect width="172" height="26" class="pill-badge" />
        <text x="12" y="17" class="font-sans" font-size="12" font-weight="700" fill="#231F1D"><tspan fill="#C4A265">✦</tspan> GITHUB</text>
      </g>
    </g>
  </g>
</svg>
